[database]
type = postgres
host = ${GF_DATABASE_HOST}
name = ${GF_DATABASE_NAME}
user = ${GF_DATABASE_USER}
password = ${GF_DATABASE_PASSWORD}
sslmode = require
url = postgres://${GF_DATABASE_USER}:${GF_DATABASE_PASSWORD}@${GF_DATABASE_HOST}:${GF_DATABASE_PORT}/${GF_DATABASE_NAME}?sslmode=require

[auth]
login_cookie_name = grafana_session

[security]
allow_embedding = true
# admin_user and admin_password are set via environment variables:
# GF_SECURITY_ADMIN_USER and GF_SECURITY_ADMIN_PASSWORD
# These are mounted from the grafana-auth Secret for rotation support

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
enable_login_token = true

[server]
protocol = https
cert_file = /etc/mdcap/certs/cert.pem
cert_key = /etc/mdcap/certs/key.pem
domain = ${MDCAP_NGINX_HOST}
root_url = ${MDCAP_NGINX_SCHEME}://%(domain)s:${MDCAP_NGINX_PORT}/grafana
serve_from_sub_path = true
