*/}}
---
apiVersion: v1
data:
  .role-id: {{ .Values.vault.env.VAULT_ROLE_ID | b64enc }}
  .secret-id: {{ .Values.vault.env.VAULT_SECRET_ID | b64enc }}
{{- if .Values.vault.tls_enabled }}
  vault_cert.pem: |-
    {{ (.Files.Glob "scripts/certs/vault/vault_cert.pem").AsSecrets | nindent 2 }}
{{- end }}

kind: Secret
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-vault-injector-secret
  namespace: {{ .Release.Namespace }}
type: opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-vault-agent-injector-configmap
  namespace: {{ .Release.Namespace }}
data:
  AGENT_INJECT_LISTEN: :8080
  AGENT_INJECT_LOG_LEVEL: info
  AGENT_INJECT_VAULT_ADDR: {{ .Values.vault.env.VAULT_ADDR }}
  AGENT_INJECT_VAULT_AUTH_PATH: {{ .Values.vault.env.VAULT_AUTH_PATH }}
  AGENT_INJECT_VAULT_IMAGE:  {{ .Values.vault.agentImage.repository }}:{{ .Values.vault.agentImage.tag }}
  AGENT_INJECT_TLS_AUTO: {{ .Release.Name }}-vault-agent-injector-cfg
  AGENT_INJECT_TLS_AUTO_HOSTS: {{ .Release.Name }}-vault-agent-injector-svc,{{ .Release.Name }}-vault-agent-injector-svc.{{ .Release.Namespace }},{{ .Release.Name }}-vault-agent-injector-svc.{{ .Release.Namespace }}.svc
  AGENT_INJECT_LOG_FORMAT: standard
  AGENT_INJECT_REVOKE_ON_SHUTDOWN: "false"
{{- if .Values.vault.namespace_enabled }}
  AGENT_INJECT_VAULT_NAMESPACE: {{ .Values.vault.env.VAULT_NAMESPACE }}
{{- end }}
  AGENT_INJECT_CPU_REQUEST: {{ .Values.vault.env.AGENT_INJECT_CPU_REQUEST }}
  AGENT_INJECT_CPU_LIMIT: {{ .Values.vault.env.AGENT_INJECT_CPU_LIMIT }}
  AGENT_INJECT_MEM_REQUEST: {{ .Values.vault.env.AGENT_INJECT_MEM_REQUEST }}
  AGENT_INJECT_MEM_LIMIT: {{ .Values.vault.env.AGENT_INJECT_MEM_LIMIT }}
  AGENT_INJECT_DEFAULT_TEMPLATE: "map"
  AGENT_INJECT_TEMPLATE_CONFIG_EXIT_ON_RETRY_FAILURE: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-vault-agent-injector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-vault-agent-injector
    app.kubernetes.io/instance: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-vault-agent-injector-clusterrole
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-vault-agent-injector
    app.kubernetes.io/instance: vault 
rules:
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations"]
  verbs: 
    - "get"
    - "list"
    - "watch"
    - "patch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-vault-agent-injector-binding
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-vault-agent-injector
    app.kubernetes.io/instance: vault  
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-vault-agent-injector-clusterrole
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-vault-agent-injector
  namespace: {{ .Release.Namespace }}
---
# Source: vault/templates/injector-mutating-webhook.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ .Release.Name }}-vault-agent-injector-cfg
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-vault-agent-injector
    app.kubernetes.io/instance: vault
    app.kubernetes.io/managed-by: Helm
webhooks:
  - name: vault.hashicorp.com
    sideEffects: None
    admissionReviewVersions:
    - "v1beta1"
    - "v1"
    clientConfig:
      service:
        name: {{ .Release.Name }}-vault-agent-injector-svc
        namespace: {{ .Release.Namespace }}
        path: "/mutate"
      caBundle: ""
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    failurePolicy: Ignore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vault-agent-injector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-vault-agent-injector
    app.kubernetes.io/instance: vault
    component: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-vault-agent-injector
      app.kubernetes.io/instance: vault
      component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-vault-agent-injector
        app.kubernetes.io/instance: vault
        component: webhook
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ .Release.Name }}-vault-agent-injector
                  app.kubernetes.io/instance: "vault"
                  component: webhook
              topologyKey: kubernetes.io/hostname
      serviceAccountName: "{{ .Release.Name }}-vault-agent-injector"
      hostNetwork: false
      {{- include "vault.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsGroup: 1000
        runAsUser: 100
      containers:
        - name: {{ .Release.Name }}-sidecar-injector
          image: {{ include "vault.image" . }}
          imagePullPolicy: "{{ .Values.vault.image.pullPolicy }}"
          securityContext:
            allowPrivilegeEscalation: false
          envFrom:
          - configMapRef:
              name: {{ .Release.Name }}-vault-agent-injector-configmap
          args:
            - agent-inject
            - 2>&1
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 8080
              scheme: HTTPS
            failureThreshold: 2
            initialDelaySeconds: 5
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
              scheme: HTTPS
            failureThreshold: 2
            initialDelaySeconds: 5
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.vault.resources | indent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vault-agent-injector-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-vault-agent-injector
    app.kubernetes.io/instance: vault
spec:
  ports:
  - name: https
    protocol: TCP
    port: 443
    targetPort: 8080
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-vault-agent-injector
    app.kubernetes.io/instance: vault
    component: webhook
---
{{ end }}