---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Release.Name }}-default
value: {{ .Values.podPriority.value }}
preemptionPolicy: {{ .Values.podPriority.preemptionPolicy }}
globalDefault: {{ .Values.podPriority.globalDefault }}
description: "Priority class for all pods."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Release.Name }}-worker
value: {{ .Values.workerPriority.value }}
preemptionPolicy: {{ .Values.workerPriority.preemptionPolicy }}
description: "MDCAP worker priority class. This'll not preempt any running pods."
{{ end }}
