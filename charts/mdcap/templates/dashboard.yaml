---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-dashboard-entrypoint-configmap
  namespace: {{ .Release.Namespace }}
data:
  {{ (.Files.Glob "scripts/web-entrypoint.sh").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-dashboard-probes-configmap
  namespace: {{ .Release.Namespace }}
data:
  {{ (.Files.Glob "scripts/dashboard-probes.sh").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-dashboard-env
  namespace: {{ .Release.Namespace }}
data:
  MDCAP_SSL_CERTS_DIR: /etc/mdcap/certs
  POD_NAME: {{ .Release.Name }}-dashboard
  MDCAP_NGINX_PLAYGROUND_PORT: "22"
  MDCAP_PLAYGROUND_HOST: {{ .Release.Name }}-playground.{{ .Release.Namespace }}.svc.cluster.local
  MDCAP_NGINX_HOST: ""
  MDCAP_API_TIMEOUT_STANDARD: {{ .Values.dashboard.env.timeout_standard | quote }}
  MDCAP_API_TIMEOUT_EXTENDED: {{ .Values.dashboard.env.timeout_extended | quote }}
  MDCAP_ALL_APPS_LINK: {{ .Values.dashboard.env.all_apps_link | quote }}
  {{- if .Values.dr.enabled }}
  DR_ROLE: "{{ .Values.dr.role }}"
  {{- end }}
{{- $origins := list }}
{{- if .Values.externalIp }}
{{- $host := ternary (printf "[%s]" .Values.externalIp) .Values.externalIp (contains ":" .Values.externalIp) }}
{{- $origins = append $origins (printf "https://%s:9443" $host) }}
{{- if and .Values.nginx.env.httpsNodePort (ne (toString .Values.nginx.env.httpsNodePort) "9443") }}
{{- $origins = append $origins (printf "https://%s:%v" $host .Values.nginx.env.httpsNodePort) }}
{{- end }}
{{- end }}
{{- if .Values.dashboard.env.allowed_origins }}
{{- $origins = append $origins .Values.dashboard.env.allowed_origins }}
{{- end }}
  ALLOWEDORIGINS: {{ join "," $origins | quote }}
{{- if .Values.externalIp }}
  KEYCLOAK_REDIRECT_URI: "https://{{ .Values.externalIp }}:9443/login"
{{- else }}
  KEYCLOAK_REDIRECT_URI: ""
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    role: {{ .Release.Name }}-dashboard-depl
    release: {{ .Release.Name }}
    app: {{ .Release.Name }}-dashboard
  name: {{ template "dashboard.fullname" . }}
{{- if .Values.dashboard.annotations }}
  annotations:
{{ toYaml .Values.dashboard.annotations | indent 4 }}
{{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 30%
      maxSurge: 1
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
        prometheus.io/scheme: https
        prometheus.io/scrape: "true"
        drrole: {{ .Values.dr.role | quote }}
{{- if .Values.podAnnotations }}
{{ toYaml .Values.podAnnotations | indent 8 }}
{{ end }}
{{- if .Values.dashboard.annotations }}
{{ toYaml .Values.dashboard.annotations | indent 8 }}
{{- end }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}-dashboard
        release: {{ .Release.Name }}
        app: {{ .Release.Name }}-dashboard
      name: {{ .Release.Name }}-dashboard
    spec:
{{- include "dashboard.imagePullSecrets" . | nindent 6 }}
{{ if .Values.dashboard.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.dashboard.nodeSelector | indent 8 }}
{{ end }}
      containers:
      #- command: ["/bin/sh"]
      #  args: [ "-c", "sleep 99999"]
      - command:
        - /scripts/web-entrypoint.sh
        - node
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-dashboard-env 
        - configMapRef:
            name: {{ .Release.Name }}-bmm-env
        image: {{ include "dashboard.image" . }}
        imagePullPolicy: "{{ .Values.dashboard.image.pullPolicy }}"
        name: {{ .Release.Name }}-dashboard
        livenessProbe:
          exec:
            command:
            - bin/sh
            - -c
            - /.robin/scripts/probes/dashboard-probes.sh
            - liveness
          failureThreshold: 30
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - bin/sh
            - -c
            - /.robin/scripts/probes/dashboard-probes.sh
            - readiness
          failureThreshold: 30
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
{{ toYaml .Values.dashboard.resources | indent 10 }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /scripts/web-entrypoint.sh
          name: {{ .Release.Name }}-dashboard-entrypoint-script
          subPath: web-entrypoint.sh
        - mountPath: /.robin/scripts/certs
          name: cert-secret
          readOnly: true
        - mountPath: /.robin/scripts/probes/dashboard-probes.sh
          name: {{ .Release.Name }}-dashboard-probes
          subPath: dashboard-probes.sh
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      hostname: {{ .Release.Name }}-dashboard
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      {{ if eq .Values.defaultPriorityClass "" }}
      priorityClassName: {{ .Release.Name }}-default
      {{- else }}
      priorityClassName: {{ .Values.defaultPriorityClass }}
      {{- end }}
      volumes:
      - name: {{ .Release.Name }}-dashboard-entrypoint-script
        configMap:
          name: {{ .Release.Name }}-dashboard-entrypoint-configmap
          defaultMode: 0755
      - name: cert-secret
        secret:
          secretName: {{ .Release.Name }}-tlscert-secret
          defaultMode: 0420
      - name: {{ .Release.Name }}-dashboard-probes
        configMap:
          defaultMode: 0744
          name: {{ .Release.Name }}-dashboard-probes-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dashboard-plg
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: {{ .Release.Name }}-dashboard-plg
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: {{ .Release.Name }}-dashboard
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dashboard
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: {{ .Release.Name }}-dashboard
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: {{ .Release.Name }}-dashboard
  type: ClusterIP
