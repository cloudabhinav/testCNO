---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-logstore-entrypoint-configmap
  namespace: {{ .Release.Namespace }}
data:
  {{ (.Files.Glob "scripts/logstore-entrypoint.sh").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-logstore-env
  namespace: {{ .Release.Namespace }}
data:
  POD_NAME: {{ .Release.Name }}-logstore
  MDCAP_SSL_CERTS_DIR: /etc/mdcap/certs
  MDCAP_ENGINE_URL: "https://{{ .Release.Name }}-engine.{{ .Release.Namespace }}.svc.cluster.local:8000"
  {{- if .Values.dr.enabled }}
  DR_ROLE: "{{ .Values.dr.role }}"
  {{- end }}
---
{{- if .Values.dr.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-logstore-dr-entrypoint-configmap
  namespace: {{ .Release.Namespace }}
data:
  {{ (.Files.Glob "scripts/logstore-dr-entrypoint.sh").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-logstore-dr-env
data:
  KAFKA_BOOTSTRAP_SERVER: "{{ .Values.dr.logstore.kafkaBootstrapServer }}"
  DR_ROLE: "{{ .Values.dr.role }}"
  LOGSTORE_TOPIC_NAME: "{{ .Values.dr.logstore.logstoreKafkaTopicName }}"
  CONSUMER_GROUP_ID: "{{ .Values.dr.logstore.consumerGroupID }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-logstore-dr-configmap-primary
  namespace: {{ .Release.Namespace }}
data:
  {{ (.Files.Glob "scripts/config/logstore-vector-primary.toml").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-logstore-dr-configmap-standby
  namespace: {{ .Release.Namespace }}
data:
  {{ (.Files.Glob "scripts/config/logstore-vector-standby.toml").AsConfig | nindent 2 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    role: {{ .Release.Name }}-logstore-depl
    release: {{ .Release.Name }}
    app: {{ .Release.Name }}-logstore
  name: {{ template "logstore.fullname" . }}
{{- if .Values.logstore.annotations }}
  annotations:
{{ toYaml .Values.logstore.annotations | indent 4 }}
{{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-logstore
  strategy:
    type: RollingUpdate
    rollingUpdate:
    {{- if .Release.IsUpgrade }}
      maxUnavailable: 1
    {{- else }}
      maxUnavailable: 30%
    {{- end }}
      maxSurge: 1
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
        prometheus.io/scheme: https
        prometheus.io/scrape: "true"
{{- if .Values.podAnnotations }}
{{ toYaml .Values.podAnnotations | indent 8 }}
{{ end }}
{{- if .Values.logstore.annotations }}
{{ toYaml .Values.logstore.annotations | indent 8 }}
{{- end }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}-logstore
        release: {{ .Release.Name }}
        app: {{ .Release.Name }}-logstore
      name: {{ .Release.Name }}-logstore
      namespace: {{ .Release.Namespace }}
    spec:
{{- include "logstore.imagePullSecrets" . | nindent 6 }}
{{ if .Values.logstore.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.logstore.nodeSelector | indent 8 }}
{{ end }}
      containers:
      - command: 
        - /scripts/logstore-entrypoint.sh
        - python3
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-logstore-env        
        image: {{ include "logstore.image" . }}
        imagePullPolicy: "{{ .Values.logstore.image.pullPolicy }}"
        name: {{ .Release.Name }}-logstore
        resources:
{{ toYaml .Values.logstore.resources | indent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: 8000
            scheme: HTTPS
          failureThreshold: 5
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
            scheme: HTTPS
          failureThreshold: 5
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /scripts/logstore-entrypoint.sh
          name: entrypoint-script
          subPath: logstore-entrypoint.sh
        - mountPath: /.robin/scripts/certs
          name: cert-secret
          readOnly: true
        - mountPath: "{{ .Values.logstore.persistentVolume.mountPath }}"
          name: {{ .Release.Name }}-logstore-volume-01
      
      {{- if .Values.dr.enabled }}
      - command:
        - /scripts/logstore-dr-entrypoint.sh
        - /bin/bash
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-logstore-dr-env
        image: "{{ .Values.dr.logstore.sidecar.image }}"
        imagePullPolicy: "{{ .Values.dr.logstore.sidecar.imagePullPolicy }}"
        name: {{ .Release.Name }}-logstore-vector
        resources:
{{ toYaml .Values.dr.logstore.sidecar.resources | indent 10 }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /scripts/logstore-dr-entrypoint.sh
          name: logstore-dr-entrypoint-script
          subPath: logstore-dr-entrypoint.sh
        - mountPath: /etc/mdcap/vector-config/logstore-vector-primary.toml
          name: logstore-dr-config-primary
          subPath: logstore-vector-primary.toml
        - mountPath: /etc/mdcap/vector-config/logstore-vector-standby.toml
          name: logstore-dr-config-standby
          subPath: logstore-vector-standby.toml
        - mountPath: "{{ .Values.logstore.persistentVolume.mountPath }}"
          name: {{ .Release.Name }}-logstore-volume-01
      {{- end }}

      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      hostAliases:
      hostname: {{ .Release.Name }}-logstore-01
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      {{ if eq .Values.defaultPriorityClass "" }}
      priorityClassName: {{ .Release.Name }}-default
      {{- else }}
      priorityClassName: {{ .Values.defaultPriorityClass }}
      {{- end }}
      volumes:
      - name: entrypoint-script
        configMap:
          name: {{ .Release.Name }}-logstore-entrypoint-configmap
          defaultMode: 0755
      {{- if .Values.dr.enabled }}
      - name: logstore-dr-entrypoint-script
        configMap:
          name: {{ .Release.Name }}-logstore-dr-entrypoint-configmap
          defaultMode: 0755
      - name: logstore-dr-config-primary
        configMap:
          name: {{ .Release.Name }}-logstore-dr-configmap-primary
          defaultMode: 0755
      - name: logstore-dr-config-standby
        configMap:
          name: {{ .Release.Name }}-logstore-dr-configmap-standby
          defaultMode: 0755
      {{- end }}
      - name: cert-secret
        secret:
          secretName: {{ .Release.Name }}-tlscert-secret
          defaultMode: 0420
      - name: {{ .Release.Name }}-logstore-volume-01
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-logstore-pvc-01
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-logstore-pvc-01
  annotations:
{{- include "util.storage.rwxAnnotation" ( dict "persistentVolume" .Values.logstore.persistentVolume ) | nindent 4 }}
{{- if .Values.logstore.persistentVolume.annotations }}
{{ toYaml .Values.logstore.persistentVolume.annotations | nindent 4 }}
{{- end }}
spec:
  accessModes:
    - {{ .Values.logstore.persistentVolume.accessMode }}
{{- include "logstore.storageclass.name" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.logstore.persistentVolume.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-logstore
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: {{ .Release.Name }}-logstore
      port: 8000
      protocol: TCP
  selector:
    app: {{ .Release.Name }}-logstore
  type: ClusterIP
