{{ if not .Values.grafana.secretNameOverride }}
---
apiVersion: v1
data:
  GRAFANA_ADMIN_USERNAME: {{ .Values.grafana.auth.username | b64enc }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.grafana.auth.password | b64enc }}
kind: Secret
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-grafana-secret
  namespace: {{ .Release.Namespace }}
type: opaque
{{ end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-grafana-ini
  namespace: {{ .Release.Namespace }}
data:
  {{- (.Files.Glob "scripts/grafana.ini").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-grafana-dashboards
  namespace: {{ .Release.Namespace }}
data:
  {{ (.Files.Glob "dashboards/*").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-grafana-configs
  namespace: {{ .Release.Namespace }}
data:
  {{ (.Files.Glob "configs/*").AsConfig | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    role: {{ .Release.Name }}-grafana-depl
    release: {{ .Release.Name }}
    app: {{ .Release.Name }}-grafana
  name: {{ template "grafana.fullname" . }}
{{- if .Values.grafana.annotations }}
  annotations:
{{ toYaml .Values.grafana.annotations | indent 4 }}
{{- end }}
spec:
  replicas: {{ .Values.grafana.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-grafana
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 30%
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}-grafana
        role: {{ .Release.Name }}-grafana-depl
        release: {{ .Release.Name }}
        app: {{ .Release.Name }}-grafana
{{- if .Values.grafana.annotations }}
      annotations:
{{- if .Values.podAnnotations }}
{{ toYaml .Values.podAnnotations | indent 8 }}
{{ end }}
{{ toYaml .Values.grafana.annotations | indent 8 }}
{{- end }}
      name: {{ template "grafana.fullname" . }}
    spec:
{{- include "grafana.imagePullSecrets" . | nindent 6 }}
{{ if .Values.grafana.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.grafana.nodeSelector | indent 8 }}
{{ end }}
      initContainers:
      - name: create-grafana-db
        image: {{ include "client.image" . }}
        imagePullPolicy: {{ .Values.client.image.pullPolicy }}
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.grafana.database.secretNameOverride | default (printf "%s-site0-postgres-creds" (.Values.grafana.database.releaseName | default "mdcapds")) }}
              key: password
        - name: PGHOST
          value: {{ .Values.grafana.database.host | default (printf "%s-pgsql.%s.svc.cluster.local" (.Values.grafana.database.releaseName | default "mdcapds") .Release.Namespace) }}
        - name: PGPORT
          value: {{ .Values.grafana.database.port | default "6623" | quote }}
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.grafana.database.secretNameOverride | default (printf "%s-site0-postgres-creds" (.Values.grafana.database.releaseName | default "mdcapds")) }}
              key: username
        - name: DBNAME
          value: {{ .Values.grafana.database.name | default "grafana" }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Init container: create-grafana-db"
            if [ "$(PGPASSWORD=${PGPASSWORD} psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d postgres -t -A -c "SELECT 1 FROM pg_database WHERE datname = '${DBNAME}'")" = "1" ]; then
              echo "Database: ${DBNAME} already exists."
            else
              echo "Creating database: ${DBNAME}"
              PGPASSWORD=${PGPASSWORD} psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d postgres -c "CREATE DATABASE ${DBNAME}"
              echo "Database: ${DBNAME} created successfully."
            fi
      containers:
      - command: ["/bin/sh","-c"]
        args:
          - |
{{ .Files.Get "scripts/grafana.sh" | indent 12 }}
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.grafana.secretNameOverride | default (printf "%s-grafana-secret" .Release.Name) }}
              key: GRAFANA_ADMIN_USERNAME
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.grafana.secretNameOverride | default (printf "%s-grafana-secret" .Release.Name) }}
              key: GRAFANA_ADMIN_PASSWORD
        - name: GF_PATHS_CONFIG
          value: {{ .Values.grafana.ini.path }}
        - name: GF_DATABASE_HOST
          value: {{ .Values.grafana.database.host | default (printf "%s-pgsql.%s.svc.cluster.local" (.Values.grafana.database.releaseName | default "mdcapds") .Release.Namespace) }}
        - name: GF_DATABASE_PORT
          value: {{ .Values.grafana.database.port | default "6623" | quote }}
        - name: GF_DATABASE_NAME
          value: {{ .Values.grafana.database.name | default "grafana" }}
        - name: GF_DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.grafana.database.secretNameOverride | default (printf "%s-site0-postgres-creds" (.Values.grafana.database.releaseName | default "mdcapds")) }}
              key: username
        - name: GF_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.grafana.database.secretNameOverride | default (printf "%s-site0-postgres-creds" (.Values.grafana.database.releaseName | default "mdcapds")) }}
              key: password
        - name: MDCAP_NGINX_HOST
          value: {{ .Release.Name }}-nginx.{{ .Release.Namespace }}.svc.cluster.local
        - name: MDCAP_NGINX_PORT
          value: "9443"
        - name: MDCAP_NGINX_SCHEME
          value: "https"
        - name: MDCAP_NAME
          value: {{ .Release.Name }}
        - name: MDCAP_NS
          value: {{ .Release.Namespace }}
        - name: GF_PATHS_DATA
          value: {{ .Values.grafana.persistentVolume.mountPath }}/data
        image: {{ include "grafana.image" . }}
        imagePullPolicy: "{{ .Values.grafana.image.pullPolicy }}"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTPS
          periodSeconds: 30
          failureThreshold: 5
          initialDelaySeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTPS
          periodSeconds: 30
          failureThreshold: 5
          initialDelaySeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: {{ .Release.Name }}-grafana
        securityContext:
          runAsUser: 0
        resources:
{{ toYaml .Values.grafana.resources | indent 10 }}
        volumeMounts:
        - mountPath: {{ .Values.grafana.persistentVolume.mountPath }}
          name: {{ .Release.Name }}-grafana-data
        - mountPath: /etc/grafana/mdcap/configs
          name: {{ .Release.Name }}-grafana-configs
        - mountPath: /etc/grafana/mdcap/dashboards
          name: {{ .Release.Name }}-grafana-dashboards
        - mountPath: {{ .Values.grafana.ini.path }}
          name: {{ .Release.Name }}-grafana-ini
          subPath: grafana.ini
        - mountPath: /etc/mdcap/certs
          name: cert-secret
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      hostname: {{ .Release.Name }}-grafana
      restartPolicy: Always
      schedulerName: default-scheduler
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      {{ if eq .Values.defaultPriorityClass "" }}
      priorityClassName: {{ .Release.Name }}-default
      {{- else }}
      priorityClassName: {{ .Values.defaultPriorityClass }}
      {{- end }}
      volumes:
      - name: {{ .Release.Name }}-grafana-configs
        configMap:
          name: {{ .Release.Name }}-grafana-configs
          defaultMode: 0755
      - name: {{ .Release.Name }}-grafana-dashboards
        configMap:
          name: {{ .Release.Name }}-grafana-dashboards
          defaultMode: 0755
      - name: {{ .Release.Name }}-grafana-ini
        configMap:
          name: {{ .Release.Name }}-grafana-ini
          defaultMode: 0755
      - name: {{ .Release.Name }}-grafana-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-grafana-pvc-data
      - name: cert-secret
        secret:
          secretName: {{ .Release.Name }}-tlscert-secret
          defaultMode: 0755
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-grafana-pvc-data
  annotations:
{{- include "util.storage.rwxAnnotation" ( dict "persistentVolume" .Values.grafana.persistentVolume ) | nindent 4 }}
{{- if .Values.grafana.persistentVolume.annotations }}
{{ toYaml .Values.grafana.persistentVolume.annotations | nindent 4 }}
{{- end }}
spec:
  accessModes:
    - {{ .Values.grafana.persistentVolume.accessMode }}
{{- include "vmetrics.storageclass.name" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.grafana.persistentVolume.size }}
---
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: {{ .Release.Name }}-grafana
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: {{ .Release.Name }}-grafana
  type: ClusterIP
{{ end }}
