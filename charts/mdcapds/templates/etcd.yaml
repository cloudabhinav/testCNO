apiVersion: v1
kind: Secret
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}-etcd-tlscerts
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": "before-hook-creation"
type: Opaque
data:
{{ ( include "util.etcd.gen-certs" . ) | indent 2 }}

---

{{/*
Irrespective of the number of the peers, create 3 etcd services, so user can change etcd replicas at any time
*/}}

{{- $control := .Values.etcd.ports.control -}}
{{- $data := .Values.etcd.ports.data -}}
{{- $releaseName := .Release.Name -}}
{{- $releaseNamespace := .Release.Namespace -}}
{{- $ip := .Values.ip -}}
{{- if and .Values.multiCluster (not $ip) -}}
{{- fail "A value must be entered for ip when multiCluster is enabled" -}}
{{- end -}}
{{- $siteIndex := include "siteindex" . -}}
{{- range $index := until 3 -}}

apiVersion: v1
kind: Service
metadata:
  name: {{ print $releaseName "-" $siteIndex "-etcd-" $index }}
  namespace: {{ $releaseNamespace }}
  {{- if $.Values.etcd.serviceAnnotations }}
  annotations:
{{ toYaml $.Values.etcd.serviceAnnotations | indent 4 }}
  {{- end }}
spec:
  {{- if and $.Values.multiCluster $ip }}
  externalIPs:
  - {{ $ip }}
  {{- end }}
  selector:
    statefulset.kubernetes.io/pod-name: {{ print $releaseName "-" $siteIndex "-etcd-" $index }}
  {{- if $.Values.multiCluster }}
  type: LoadBalancer
  {{- else }}
  type: ClusterIP
  {{- end }}
  ports:
  - name: client
    port: {{ add (int $data ) (mul $index 2) }}
    protocol: TCP
    targetPort: 2379
  - name: server
    port: {{ add (int $control ) (mul $index 2) }}
    protocol: TCP
    targetPort: 2380
---
{{- end -}}


apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-{{ template "siteindex" .}}-etcd
  namespace: {{ .Release.Namespace }}
  labels:
    application: {{ .Release.Name }}-etcd
    team: mdcapds
    release: {{ .Release.Name }}-etcd
    app: {{ .Release.Name }}-etcd
  {{- if .Values.etcd.annotations }}
  annotations:
{{ toYaml .Values.etcd.annotations | indent 4 }}
  {{- end }}
spec:
  podManagementPolicy: OrderedReady
  {{- if eq (len .Values.peers) 1 }}
  replicas: 3
  {{- else }}
  replicas: 1
  {{- end }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      application: {{ .Release.Name }}-etcd
  serviceName: {{ .Release.Name }}-{{ template "siteindex" .}}-etcd
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "2379"
        prometheus.io/scheme: https
        prometheus.io/scrape: "true"
{{- if .Values.podAnnotations }}
{{ toYaml .Values.podAnnotations | indent 8 }}
{{ end }}
        # robin.io/robinrpool: {{ .Values.podAnnotations.robinrpool | quote }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}-{{ template "siteindex" .}}-etcd
        application: {{ .Release.Name }}-etcd
        team: mdcapds
        release: {{ .Release.Name }}-etcd
        app: {{ .Release.Name }}-etcd
      namespace: {{ .Release.Namespace }}
    spec:
      securityContext:
          fsGroup: 1001
          runAsUser: 1001
          runAsGroup: 1001
{{- include "etcd.imagePullSecrets" . | nindent 6 }}
{{ if .Values.etcd.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.etcd.nodeSelector | indent 8 }}
{{ end }}
      containers:
      - name: {{ .Release.Name }}-{{ template "siteindex" .}}-etcd
        command: ["/bin/sh","-c"]
        args:
          - |
{{ .Files.Get "scripts/launch_etcd.sh" | indent 12 }}
        env:
        - name: ETCD_QUOTA_BACKEND_BYTES
          value: {{ printf "%d" (.Values.etcd.quotaBackendBytes | int64) | quote }}
        - name: ETCD_AUTO_COMPACTION_MODE
          value: {{ .Values.etcd.autoCompactionMode | quote }}
        - name: ETCD_AUTO_COMPACTION_RETENTION
          value: {{ .Values.etcd.autoCompactionRetention | quote }}
        - name: INSTALL_MODE
          value: {{ .Values.mode }}
        - name: ETCD_NAME
          value: mdcapds-{{ template "siteindex" .}}
        - name: ETCD_INITIAL_CLUSTER_STATE
        {{- if eq "install" .Values.mode }}
          value: new
        {{- else if eq "scale" .Values.mode }}
          value: existing
        {{- else }}
        {{- fail "value for .Values.mode is invalid, valid values are install/scale" }}
        {{- end }}
        - name: ETCD_DATA_DIR
          value: /data
        - name: CONTROL_PORT
          value: {{ .Values.etcd.ports.control | quote }}
        - name: DATA_PORT
          value: {{ .Values.etcd.ports.data | quote }}
        - name: NUM_SITES
          value: {{ len .Values.peers | quote }}
        - name: MULTI_CLUSTER
          value: {{ .Values.multiCluster | quote }}
        - name: IP
          value: {{ .Values.ip | quote }}
        - name: PEERS
          value: {{ .Values.peers | join "," }}
        image: {{ include "etcd.image" . }}
        imagePullPolicy: "{{ .Values.etcd.image.pullPolicy }}"
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /health
            port: client
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        ports:
        - containerPort: 2379
          name: client
          protocol: TCP
        - containerPort: 2380
          name: server
          protocol: TCP
        resources:
{{ toYaml .Values.etcd.resources | indent 10 }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: etcd-data
        - mountPath: /etc/etcd/certs
          name: etcd-certs
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      {{ if eq .Values.defaultPriorityClass "" }}
      priorityClassName: {{ .Release.Name }}-default
      {{- else }}
      priorityClassName: {{ .Values.defaultPriorityClass }}
      {{- end }}
      volumes:
      - emptyDir:
          medium: Memory
        name: dshm
      - name: etcd-certs
        secret:
          secretName: {{ .Release.Name }}-etcd-tlscerts
          defaultMode: 0420
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      labels:
        application: {{ .Release.Name }}-etcd
      annotations:
        volume.alpha.kubernetes.io/storage-class: {{ .Values.etcd.persistentVolume.storageClass }}
        {{- if .Values.etcd.persistentVolume.annotations }}
{{ toYaml .Values.etcd.persistentVolume.annotations | indent 8 }}
        {{- end }}
      name: etcd-data
    spec:
{{- include "etcd.storageclass.name" . | nindent 6 }}
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.etcd.persistentVolume.size }}
      volumeMode: Filesystem