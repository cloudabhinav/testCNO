{{/*
Copyright (C) 2021 Robin.io All Rights Reserved.

This deletes the cert secrets created in pre-install hook.
It uses patroni-exporter image which is an alpine image with curl installed.
We're doing this in pre-delete because the rolebinding created during install
will not be available in post-delete and without that DELETE API will fail.
*/}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-predelete-hook-certs
  namespace: {{ .Release.Namespace }}
  annotations:
      "helm.sh/hook": "pre-delete"
      "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
spec:
  template:
    metadata:
      name: "{{ .Release.Name }}"
{{- if .Values.podAnnotations }}
      annotations:
{{ toYaml .Values.podAnnotations | indent 8 }}
{{ end }}
    spec:
{{- include "etcd.imagePullSecrets" . | nindent 6 }}
      containers:
      - command:
        - "/bin/sh"
        - "-ec"
        - |
          curl -X DELETE -kv https://kubernetes.default.svc/api/v1/namespaces/${NAMESPACE}/secrets/${ETCD_SECRET_NAME} \
            -H "Authorization: Bearer $( cat /var/run/secrets/kubernetes.io/serviceaccount/token )" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" --retry 3 --retry-delay 5 && curl -X DELETE -kv https://kubernetes.default.svc/api/v1/namespaces/${NAMESPACE}/secrets/${POSTGRES_SECRET_NAME} \
            -H "Authorization: Bearer $( cat /var/run/secrets/kubernetes.io/serviceaccount/token )" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" --retry 3 --retry-delay 5
        env:
        - name: ETCD_SECRET_NAME
          value: {{ .Release.Name }}-etcd-tlscerts
        - name: POSTGRES_SECRET_NAME
          value: {{ .Release.Name }}-postgresql-tlscerts
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: {{ include "patroniExporter.image" . }}
        imagePullPolicy: IfNotPresent
        name: {{ .Release.Name }}-predelete-hook
        resources:
{{ toYaml .Values.predeleteHookCerts.resources | indent 10 }}
      restartPolicy: Never
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 0
